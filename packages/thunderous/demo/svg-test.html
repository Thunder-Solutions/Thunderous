<!doctype html>
<html>
<head><title>SVG Case Test</title></head>
<body>
    <h1>SVG Case Sensitivity Test</h1>
    <div id="output"></div>
    <script>
        // Test 1: Direct template innerHTML
        const t1 = document.createElement('template');
        t1.innerHTML = '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40"/></svg>';
        
        // Test 2: Namespace-correct SVG creation
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        
        document.getElementById('output').innerHTML = `
            <p><strong>Template innerHTML result:</strong></p>
            <pre>${t1.innerHTML}</pre>
            <p>viewBox preserved? ${t1.innerHTML.includes('viewBox') ? 'YES' : 'NO (bug!)'}</p>
            
            <p><strong>createElementNS result:</strong></p>
            <pre>${svg.outerHTML}</pre>
            <p>viewBox preserved? ${svg.outerHTML.includes('viewBox') ? 'YES' : 'NO'}</p>
        `;
    </script>
</body>
</html>
