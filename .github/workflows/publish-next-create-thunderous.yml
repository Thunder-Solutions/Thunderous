name: Publish create-thunderous (next)

on:
  push:
    branches: [next]
    paths:
      - 'packages/create-thunderous/package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-checks.yml

  publish:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/publish-package
        with:
          package: create-thunderous
          path: packages/create-thunderous
          tag: next
