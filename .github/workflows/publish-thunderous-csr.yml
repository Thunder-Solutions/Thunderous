name: Publish thunderous-csr

on:
  push:
    tags:
      - 'thunderous-csr@v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-checks.yml

  publish:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/publish-package
        with:
          package: thunderous-csr
          path: packages/thunderous-csr
