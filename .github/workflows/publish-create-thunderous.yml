name: Publish create-thunderous

on:
  push:
    branches: [main, next]
    paths:
      - 'packages/create-thunderous/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish-create-thunderous.yml'
      - '.github/workflows/quality-checks.yml'
      - '.github/actions/publish-package/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-checks.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/publish-package
        with:
          package: create-thunderous
          path: packages/create-thunderous
          channel: ${{ github.ref == 'refs/heads/main' && 'stable' || 'next' }}
