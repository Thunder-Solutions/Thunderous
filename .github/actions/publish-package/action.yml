name: Publish Package

description: Builds and publishes a package to npm

inputs:
  package:
    description: Package name (e.g., thunderous, thunderous-csr)
    required: true
  path:
    description: Path to package directory (e.g., packages/thunderous)
    required: true
  tag:
    description: NPM dist-tag to use (e.g., latest, next, beta)
    required: false
    default: 'latest'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.33.0

    - uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build
      shell: bash
      run: pnpm turbo run build --filter=${{ inputs.package }}...

    - name: Prepare prerelease version
      shell: bash
      if: ${{ inputs.tag != 'latest' }}
      run: |
        VERSION=$(jq -r '.version' ${{ inputs.path }}/package.json)
        PRERELEASE_VERSION="${VERSION}-${{ inputs.tag }}.$(date +%s)"
        jq ".version = \"$PRERELEASE_VERSION\"" ${{ inputs.path }}/package.json > ${{ inputs.path }}/package.json.tmp
        mv ${{ inputs.path }}/package.json.tmp ${{ inputs.path }}/package.json
        echo "Prepared prerelease version: $PRERELEASE_VERSION"

    - name: Publish
      shell: bash
      env:
        NPM_CONFIG_PROVENANCE: 'true'
      run: |
        VERSION=$(jq -r '.version' ${{ inputs.path }}/package.json)
        if pnpm view ${{ inputs.package }}@$VERSION version >/dev/null 2>&1; then
          echo "${{ inputs.package }}@$VERSION already published"
          exit 0
        fi
        pnpm publish --filter=${{ inputs.package }} --access public --no-git-checks --tag ${{ inputs.tag }}
