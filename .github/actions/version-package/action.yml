name: Version Package

description: Detects version bumps, creates tags, and cuts release branches

inputs:
  package:
    description: Package name (e.g., thunderous)
    required: true
  path:
    description: Path to package directory (e.g., packages/thunderous)
    required: true

runs:
  using: composite
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Detect version bump and create tag
      shell: bash
      run: |
        VERSION=$(jq -r '.version' ${{ inputs.path }}/package.json)
        TAG="${{ inputs.package }}@v${VERSION}"

        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "$TAG already exists"
          exit 0
        fi

        echo "Creating $TAG"
        git tag -a "$TAG" -m "Release ${{ inputs.package }} v${VERSION}"
        git push origin "$TAG"

    - name: Cut release branch for major/minor bumps
      shell: bash
      run: |
        NEW_VERSION=$(jq -r '.version' ${{ inputs.path }}/package.json)

        # Get the previous version from the last tag
        LAST_TAG=$(git tag -l "${{ inputs.package }}@v*" --sort=-v:refname | head -1)
        if [ -z "$LAST_TAG" ]; then
          echo "No previous tag found, skipping branch cut"
          exit 0
        fi

        # Extract version from tag
        OLD_VERSION=$(echo "$LAST_TAG" | sed 's/.*@v//')

        # Check if major or minor changed
        OLD_MAJOR_MINOR=$(echo "$OLD_VERSION" | cut -d. -f1,2)
        NEW_MAJOR_MINOR=$(echo "$NEW_VERSION" | cut -d. -f1,2)

        if [ "$OLD_MAJOR_MINOR" = "$NEW_MAJOR_MINOR" ]; then
          echo "Only patch bump ($OLD_VERSION -> $NEW_VERSION), no branch needed"
          exit 0
        fi

        # Create maintenance branch for the OLD version
        BRANCH="release/${{ inputs.package }}-${OLD_MAJOR_MINOR}"

        if git rev-parse --verify "$BRANCH" >/dev/null 2>&1 || \
           git ls-remote --heads origin "$BRANCH" | grep -q "."; then
          echo "$BRANCH already exists"
          exit 0
        fi

        echo "Creating maintenance branch $BRANCH for v${OLD_MAJOR_MINOR}"
        git checkout -b "$BRANCH" "$LAST_TAG"
        git push origin "$BRANCH"
        git checkout main
